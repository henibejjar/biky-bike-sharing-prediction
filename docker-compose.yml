version: '3.8'

services:
  backend:
    build: ./backend
    container_name: bike-api
    ports:
      - "8000:8000"
    volumes:
      - ./backend/model:/app/model
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: bike-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: bike-network
